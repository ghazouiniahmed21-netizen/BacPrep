<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="info.css">
</head>
<body>
    <br><br>
    <table border="1px" >
        <tr>
            <th colspan="4">Entre votre avie</th>
        </tr>
        <tr>
            <th>Nom</th>
            <td><input type="text" class="wiw" id="nom"></td>
  
        </tr>
        <tr>
            <th>Prenom</th>
            <td><input type="text" class="wiw" id="prenom"></td> 
        </tr>
        <tr>
            <th>Bac</th>
            <td>
            <select name="" id="s" class="wiw">
                <option value="--">--</option>
                <option value="informatique">informatique</option>
                <option value="science">science</option>
                <option value="economie">economie</option>
            </select>
            </td>
        </tr>
        <tr>
            <th>Note ('/10')</th>
            <td><input type="number" max="10" min="0" class="wiw" id="note"></td>
        </tr>
        <tr>
            <td colspan="4">
                <input type="button" value="Ajouter" id="inttd" onclick="ajouter_avis()">
            </td>
        </tr>
    </table>

    <br><br><br><br>
    <table border="1px" id="tab">
        <tr>
            <th colspan="4">Tbleau des avies</th>
        </tr>
        <tr>
            <th>Nom</th>
            <th>Prenom</th>
            <th>Bac</th>
            <th>Note ('/10')</th>
        </tr>
    </table>
    <script src="page.js"></script>
</body>
</html>
